<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting" content="yes">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{ subject }}</title>
<!--[if mso]>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
<![endif]-->
<!--[if mso]>
<style>
table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
.btn-cell { mso-padding-alt: 14px 28px; }
</style>
<![endif]-->
<style>
/* Layout lives in inline style attributes. This block only holds what cannot be inlined: resets, narrow screens, dark mode. */
body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
@media (max-width: 620px) {
  .container { width: 100% !important; }
  .pad { padding-left: 16px !important; padding-right: 16px !important; }
  .btn-cell { width: 100% !important; }
  .btn-link { display: block !important; }
}
@media (prefers-color-scheme: dark) {
  .dm-page { background-color: #14161a !important; }
  .dm-card { background-color: #1e2128 !important; }
  .dm-ink { color: #f2f3f5 !important; }
  .dm-muted { color: #b9bfcb !important; }
  .dm-rule { border-color: #3a3f4b !important; }
  .dm-btn { background-color: #ff9a8a !important; }
  .dm-btn-link { color: #2a0d08 !important; }
  .dm-link { color: #ffb4a8 !important; }
}
</style>
</head>
<body class="dm-page" style="margin:0;padding:0;background-color:#f3efe8;" bgcolor="#f3efe8">
<div role="article" aria-roledescription="email" aria-label="{{ subject }}" lang="en" style="margin:0;padding:0;">
<table role="presentation" class="dm-page" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f3efe8;" bgcolor="#f3efe8">
<tr>
<td align="center" style="padding:16px 8px;">

<table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;">
<tr>
<td class="pad dm-muted" style="padding:0 24px 12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#5a5f6b;">
{{ preheader }}
</td>
</tr>
<tr>
<td class="dm-card" style="background-color:#ffffff;border-radius:8px;" bgcolor="#ffffff">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td class="pad dm-rule" style="padding:20px 32px;border-bottom:1px solid #e6e1d8;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:28px;color:#1f2430;">
<a class="dm-ink" href="{{ url_shop }}" style="color:#1f2430;text-decoration:none;">{{ store_name }}</a>
</td>
</tr>
{{ body }}
<tr>
<td class="pad dm-rule dm-muted" style="padding:20px 32px 28px 32px;border-top:1px solid #e6e1d8;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#5a5f6b;">
You are receiving this email because you started a checkout at {{ store_name }} with this address and did not finish it.<br>
{{ store_name }}, {{ postal_address }}<br>
<a class="dm-link" href="{{ unsubscribe_url }}" style="color:#9a2a1f;text-decoration:underline;">Unsubscribe</a> from reminders like this one.
</td>
</tr>
</table>

</td>
</tr>
</table>

</td>
</tr>
</table>
</div>
</body>
</html>
