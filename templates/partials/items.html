<tr>
<td class="pad" style="padding:8px 32px 0 32px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
{{#items}}
<tr>
<td class="dm-rule" width="88" valign="top" style="width:88px;padding:12px 0;border-bottom:1px solid #e6e1d8;">
<img src="{{ image_url }}" width="72" height="72" alt="{{ title }}" style="display:block;width:72px;height:72px;border:0;background-color:#eee9e0;">
</td>
<td class="dm-rule dm-ink" valign="top" style="padding:12px 12px 12px 8px;border-bottom:1px solid #e6e1d8;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;color:#1f2430;">
<strong>{{ title }}</strong><br>
<span class="dm-muted" style="font-size:14px;line-height:20px;color:#5a5f6b;">{{ variant }} &middot; Qty {{ quantity }}</span>
</td>
<td class="dm-rule dm-ink" width="90" align="right" valign="top" style="width:90px;padding:12px 0;border-bottom:1px solid #e6e1d8;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;color:#1f2430;white-space:nowrap;">
{{ price }}
</td>
</tr>
{{/items}}
<tr>
<td colspan="2" class="dm-ink" align="right" style="padding:14px 8px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;color:#1f2430;">
<strong>Subtotal</strong>
</td>
<td class="dm-ink" align="right" style="padding:14px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;color:#1f2430;white-space:nowrap;">
<strong>{{ subtotal }}</strong>
</td>
</tr>
<tr>
<td colspan="3" class="dm-muted" style="padding:4px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#5a5f6b;">
Shipping and tax are shown at checkout.
</td>
</tr>
</table>
</td>
</tr>
